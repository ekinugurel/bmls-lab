  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    a { text-decoration: none; color: inherit; cursor: pointer; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .fu  { animation: fadeUp 0.65s ease both; }
    .fu1 { animation: fadeUp 0.65s 0.10s ease both; }
    .fu2 { animation: fadeUp 0.65s 0.20s ease both; }
    .fu3 { animation: fadeUp 0.65s 0.32s ease both; }
    .fu4 { animation: fadeUp 0.65s 0.44s ease both; }
    .fi  { animation: fadeIn 0.8s 0.3s ease both; }

    /* ── Tweaks panel ── */
    .tweak-panel {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: #fff; border: 1px solid #e2e2e2; border-radius: 12px;
      padding: 20px; width: 264px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.14);
      font-family: 'DM Sans', sans-serif; font-size: 13px;
    }
    .tweak-panel h4 {
      font-size: 11px; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: #888; margin-bottom: 12px;
    }
    .tweak-btn {
      display: block; width: 100%; padding: 9px 12px; margin-bottom: 6px;
      border-radius: 7px; border: 1.5px solid #e2e2e2;
      background: transparent; cursor: pointer; text-align: left;
      transition: all 0.15s; color: #444;
    }
    .tweak-btn:hover  { border-color: #C8102E; color: #C8102E; }
    .tweak-btn.active { border-color: #C8102E; background: #C8102E; color: #fff; }
    .tweak-name  { font-size: 12px; font-weight: 600; }
    .tweak-desc  { font-size: 10.5px; opacity: 0.72; margin-top: 2px; }

    /* ── V1 styles ── colours come from the lab mark */
    .v1 {
      --ink:#1C1B1A; --text:#33302C; --muted:#6B655D; --rule:#E5E1D9;
      --coral:#E0605A; --coral-ink:#B3443D; --paper:#FFFFFF;
      --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
      --sans:"Source Sans 3", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background:var(--paper); color:var(--text); min-height:100vh;
      font-family:var(--serif); font-size:18px; line-height:1.65;
    }
    .v1 a { color:inherit; }
    .v1 strong { font-weight:600; }
    .v1-wrap { max-width:1120px; margin:0 auto; padding:0 32px; }
    .v1-muted { color:var(--muted); }

    /* header */
    .v1-header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.95);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--rule); }
    .v1-header-inner { display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:72px; }
    .v1-brand { display:flex; align-items:center; gap:12px; }
    .v1-brand-mark { height:31px; width:auto; display:block; }
    .v1-brand-text { display:flex; flex-direction:column; line-height:1.2; }
    .v1-brand-name { font-size:19px; font-weight:600; color:var(--ink); }
    .v1-brand-sub { font-family:var(--sans); font-size:14px; color:var(--muted); }
    .v1-nav { display:flex; flex-wrap:wrap; gap:4px 28px; font-family:var(--sans); font-size:16px; }
    .v1-nav a { color:var(--text); padding:3px 0; border-bottom:1.5px solid transparent; transition:border-color .15s, color .15s; }
    .v1-nav a:hover { color:var(--ink); border-bottom-color:var(--coral); }

    /* hero */
    .v1-hero { padding:76px 0 0; }
    .v1-hero-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,380px); gap:56px; align-items:center; }
    .v1-kicker { font-family:var(--sans); font-size:16.5px; color:var(--muted); margin-bottom:16px; }
    .v1-h1 { font-size:clamp(36px,3.6vw,50px); line-height:1.07; font-weight:600; letter-spacing:-0.012em;
      color:var(--ink); margin-bottom:24px; text-wrap:balance; }
    .v1-lede { font-size:21px; line-height:1.55; max-width:32em; margin-bottom:32px; }
    .v1-hero-links { display:flex; align-items:center; gap:28px; flex-wrap:wrap; font-family:var(--sans); font-size:16.5px; }
    .v1 a.v1-btn { background:var(--ink); color:#fff; padding:10px 20px; border-radius:3px; transition:background .15s; }
    .v1 a.v1-btn:hover { background:#45413C; }
    .v1-textlink, .v1-links a, .v1-contact a {
      text-decoration:underline; text-decoration-color:var(--coral); text-decoration-thickness:1.5px; text-underline-offset:4px; }
    .v1-textlink { color:var(--ink); }
    .v1-textlink:hover, .v1-links a:hover, .v1-contact a:hover { color:var(--coral-ink); }
    .v1-hero-mark { display:block; width:100%; max-width:430px; justify-self:end; }
    .v1-focus { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:32px;
      margin-top:72px; padding-top:24px; border-top:1px solid var(--rule); }
    .v1-focus dt { font-family:var(--sans); font-size:15px; color:var(--muted); margin-bottom:2px; }
    .v1-focus dd { font-size:18.5px; line-height:1.4; color:var(--ink); }

    /* sections */
    .v1-section { padding-top:96px; scroll-margin-top:72px; }
    .v1-h2 { font-size:34px; line-height:1.15; font-weight:600; letter-spacing:-0.01em; color:var(--ink);
      padding-top:22px; border-top:1px solid var(--ink); }
    .v1-intro { font-size:20px; line-height:1.6; max-width:38em; margin-top:16px; }
    .v1-h3 { font-size:26px; line-height:1.22; font-weight:600; letter-spacing:-0.006em; color:var(--ink); margin-bottom:14px; }

    /* research */
    .v1-thrust { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; align-items:start; margin-top:64px; }
    .v1-thrust.flip .v1-thrust-fig { order:2; }
    .v1-thrust-text p { margin-bottom:16px; }
    .v1-related-h { font-family:var(--sans); font-size:15.5px; font-weight:600; color:var(--ink); margin:28px 0 2px; }
    .v1-related { list-style:none; }
    .v1-related li { font-size:16px; line-height:1.5; padding:11px 0; border-bottom:1px solid var(--rule); color:var(--ink); }
    .v1-related a, .v1-news-text a, .v1-pub-title a {
      text-decoration:underline; text-decoration-color:var(--rule); text-decoration-thickness:1px; text-underline-offset:3px; transition:text-decoration-color .15s; }
    .v1-related a:hover, .v1-news-text a:hover, .v1-pub-title a:hover { text-decoration-color:var(--coral); }

    /* people */
    .v1-person { display:grid; grid-template-columns:200px minmax(0,1fr); gap:48px; align-items:start; margin-top:40px; }
    .v1-person p { margin-bottom:14px; max-width:44em; }
    .v1-photo { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; object-position:center top; border-radius:2px; }
    .v1-person .v1-role { font-family:var(--sans); font-size:15.5px; color:var(--coral-ink); margin-bottom:4px; }
    .v1-name { font-size:30px; margin-bottom:4px; }
    .v1-person .v1-affil { font-family:var(--sans); font-size:16px; line-height:1.5; color:var(--muted); margin-bottom:18px; }
    .v1-person .v1-links { display:flex; flex-wrap:wrap; gap:6px 24px; font-family:var(--sans); font-size:16px; margin-top:18px; }
    .v1-subhead { font-size:24px; font-weight:600; color:var(--ink); margin-top:64px; padding-top:24px; border-top:1px solid var(--rule); }
    .v1-subhead + .v1-person { margin-top:24px; }

    /* news */
    .v1-news { list-style:none; margin-top:20px; }
    .v1-news li { display:grid; grid-template-columns:104px minmax(0,1fr); gap:28px; padding:14px 0; border-bottom:1px solid var(--rule); }
    .v1-date { font-family:var(--sans); font-size:15.5px; color:var(--muted); padding-top:2px; font-variant-numeric:tabular-nums; }
    .v1-news-text { font-size:17px; line-height:1.6; }
    .v1-news-text a { text-decoration-color:#C4BDB1 !important; text-underline-offset:3px; }
    .v1-news-text a:hover { text-decoration-color:var(--coral) !important; }

    /* publications */
    .v1-pubyear { display:grid; grid-template-columns:104px minmax(0,1fr); gap:28px; padding:22px 0 6px; border-bottom:1px solid var(--rule); }
    .v1-pubyear:first-of-type { margin-top:8px; }
    .v1-year { font-family:var(--sans); font-size:17px; font-weight:600; color:var(--ink); padding-top:2px; }
    .v1-pubs { list-style:none; }
    .v1-pubs li { margin-bottom:18px; }
    .v1-pub-title { display:block; font-size:18px; line-height:1.4; font-weight:600; color:var(--ink); }
    .v1-pub-authors { display:block; font-family:var(--sans); font-size:15.5px; line-height:1.5; color:var(--muted); margin-top:3px; }
    .v1-pub-authors strong { color:var(--text); }
    .v1-pub-meta { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px; font-size:16.5px; margin-top:1px; }
    .v1-pub-meta a { font-family:var(--sans); font-size:15px; color:var(--coral-ink);
      text-decoration:underline; text-decoration-color:transparent; text-underline-offset:3px; }
    .v1-pub-meta a:hover { text-decoration-color:currentColor; }

    /* join */
    .v1-join { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; margin-top:28px; }
    .v1-join .v1-h3 { font-size:22px; margin-bottom:6px; }
    .v1-contact { margin-top:36px; padding-top:22px; border-top:1px solid var(--rule); }
    .v1-contact a { color:var(--ink); }

    /* footer */
    .v1-footer { margin-top:112px; border-top:1px solid var(--rule); padding:26px 0 40px;
      font-family:var(--sans); font-size:14.5px; color:var(--muted); }
    .v1-footer-inner { display:flex; justify-content:space-between; align-items:center; gap:12px 24px; flex-wrap:wrap; }
    .v1-footer-brand { display:flex; align-items:center; gap:12px; }
    .v1-footer-mark { height:20px; width:auto; display:block; flex-shrink:0; }

    @media (max-width: 900px) {
      .v1-hero-grid { grid-template-columns:1fr; }
      .v1-hero-mark { display:none; }
      .v1-focus { grid-template-columns:1fr; gap:14px; margin-top:48px; }
      .v1-thrust { grid-template-columns:1fr; gap:28px; }
      .v1-thrust.flip .v1-thrust-fig { order:0; }
      .v1-join { grid-template-columns:1fr; gap:20px; }
    }
    @media (max-width: 680px) {
      .v1 { font-size:17px; }
      .v1-wrap { padding:0 20px; }
      .v1-header { position:static; }
      .v1-header-inner { flex-direction:column; align-items:flex-start; gap:10px; padding-top:14px; padding-bottom:12px; min-height:0; }
      .v1-nav { gap:2px 20px; font-size:15.5px; }
      .v1-hero { padding-top:44px; }
      .v1-lede { font-size:19px; }
      .v1-section { padding-top:72px; }
      .v1-h2 { font-size:30px; }
      .v1-h3 { font-size:23px; }
      .v1-person { grid-template-columns:1fr; gap:20px; }
      .v1-photo { max-width:180px; }
      .v1-news li, .v1-pubyear { grid-template-columns:1fr; gap:4px; }
      .v1-footer { margin-top:80px; }
    }
  </style>

/* Research figure: click to view full size */
const ResearchFigure = ({ src, alt, width="100%" }) => {
  const [open,setOpen]=useState(false);
  useEffect(()=>{
    if(!open) return;
    const onKey=e=>{ if(e.key==="Escape") setOpen(false); };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[open]);
  return (
    <>
      <button onClick={()=>setOpen(true)} aria-label={`Enlarge figure: ${alt}`}
        style={{ display:"block", width, margin:"0 auto", padding:"20px", background:"#fff", border:"1px solid #E2DDD4", borderRadius:6, cursor:"zoom-in" }}>
        <img src={src} alt={alt} style={{ width:"100%", display:"block" }}/>
      </button>
      {open && (
        <div onClick={()=>setOpen(false)} style={{ position:"fixed", inset:0, background:"rgba(26,23,18,0.82)", zIndex:10000,
          display:"flex", alignItems:"center", justifyContent:"center", padding:"4vw", cursor:"zoom-out" }}>
          <img src={src} alt={alt} style={{ maxWidth:"100%", maxHeight:"100%", background:"#fff", padding:24, borderRadius:6 }}/>
        </div>
      )}
    </>
  );
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": 1
}/*EDITMODE-END*/;

function App() {
  const [variant, setVariant] = useState(() => {
    try { return JSON.parse(localStorage.getItem('bmls_v')) ?? TWEAK_DEFAULTS.variant; }
    catch { return TWEAK_DEFAULTS.variant; }
  });
  const [tweaksOn, setTweaksOn] = useState(false);

  useEffect(() => {
    localStorage.setItem('bmls_v', JSON.stringify(variant));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ variant } }, '*');
  }, [variant]);

  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOn(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      {variant === 1 && <V1/>}
      {variant === 2 && <V2/>}
      {variant === 3 && <V3/>}
      {tweaksOn && <TweakPanel variant={variant} setVariant={setVariant}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
