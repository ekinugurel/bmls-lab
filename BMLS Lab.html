const TweakPanel = ({ variant, setVariant }) => (
  <div className="tweak-panel">
    <h4>Tweaks</h4>
    <div style={{ fontSize:11, color:"#aaa", marginBottom:8, fontFamily:"'DM Sans',sans-serif" }}>Design Variant</div>
    {[
      [1,"Academic Minimal","Warm serif · editorial · UH red"],
      [2,"Bold Dark","Dark bg · dramatic · high-contrast"],
      [3,"Systems Grid","Structured · technical · split hero"],
    ].map(([v,name,desc])=>(
      <button key={v} className={`tweak-btn ${variant===v?"active":""}`} onClick={()=>setVariant(v)}>
        <div className="tweak-name">{name}</div>
        <div className="tweak-desc">{desc}</div>
      </button>
    ))}
  </div>
);

/* ══════════════════════════════════════════════
   APP
══════════════════════════════════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": 1
}/*EDITMODE-END*/;

function App() {
  const [variant, setVariant] = useState(() => {
    try { return JSON.parse(localStorage.getItem('bmls_v')) ?? TWEAK_DEFAULTS.variant; }
    catch { return TWEAK_DEFAULTS.variant; }
  });
  const [tweaksOn, setTweaksOn] = useState(false);

  useEffect(() => {
    localStorage.setItem('bmls_v', JSON.stringify(variant));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ variant } }, '*');
  }, [variant]);

  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOn(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      {variant === 1 && <V1/>}
      {variant === 2 && <V2/>}
      {variant === 3 && <V3/>}
      {tweaksOn && <TweakPanel variant={variant} setVariant={setVariant}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
